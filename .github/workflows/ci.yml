name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**']
  pull_request:
    branches: [main, develop]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          pip install pytest pytest-cov httpx
      - name: Run backend tests
        run: |
          if [ -d backend/tests ]; then pytest backend/tests --cov=backend/app --cov-report=term-missing; else echo "No backend tests yet"; fi

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: |
          if [ -f frontend/package-lock.json ]; then cd frontend && npm ci; elif [ -f frontend/package.json ]; then cd frontend && npm install; else echo "No frontend package yet"; fi
      - name: Run frontend tests
        run: |
          if [ -f frontend/package.json ]; then cd frontend && npx vitest run --coverage; else echo "No frontend tests yet"; fi

  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker compose build
        run: |
          if [ -f docker-compose.yml ]; then docker compose build; else echo "No docker-compose.yml yet"; fi
